<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobCopilot Analyzer</title>
  <style>
    body {
      width: 310px;
      padding: 16px;
      font-family: -apple-system, system-ui, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      margin: 0;
    }
    .header {
      font-weight: 700;
      font-size: 16px;
      color: #fafafa;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #3f3f46;
      color: #71717a;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #27272a;
      color: #e4e4e7;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #3f3f46;
    }
    #error {
      color: #f87171;
      font-size: 12px;
      margin-top: 10px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🤖</span> JobCopilot
  </div>
  <div class="status" id="status">
    Ready to extract this page and send it to your JobCopilot AI for analysis.
  </div>
  <button id="analyzeBtn">Analyze Job Fit</button>
  <button id="dashboardBtn" class="btn-secondary" style="display: none;">Open JobCopilot Dashboard ↗</button>
  <div id="error"></div>
  <script src="auth_helper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
